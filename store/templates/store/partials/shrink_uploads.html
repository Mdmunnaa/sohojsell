<script>
/* ছবি পাঠানোর আগে ফোনেই ছোট করা: ফোনের ৩–৫ MB ছবি ~৩০০ KB হয়ে যায়, তাই মোবাইল ডেটায় সেভ অনেক দ্রুত।
   সার্ভার পরে আবার ১২০০px-এ নামায় (store/images.py), তাই মান কমে না। শুধু JPEG/WebP/HEIC — PNG (স্বচ্ছ লোগো)
   যেমন আছে তেমন যায়। কোনো কারণে না পারলে আসল ছবিটাই যায়। কোনো ঘরে না চাইলে: data-no-shrink */
(function () {
  var MAX = 1600, QUALITY = 0.85, MIN_BYTES = 400 * 1024;
  if (!window.DataTransfer || !window.createImageBitmap || !window.WeakMap || !HTMLCanvasElement.prototype.toBlob) return;
  var pending = new WeakMap();
  function shrink(file) {
    if (!/^image\/(jpeg|webp|heic|heif)$/i.test(file.type) || file.size < MIN_BYTES) return Promise.resolve(null);
    return createImageBitmap(file, { imageOrientation: 'from-image' }).then(function (bmp) {
      var scale = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(bmp.width * scale);
      canvas.height = Math.round(bmp.height * scale);
      var ctx = canvas.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
      if (bmp.close) bmp.close();
      return new Promise(function (resolve) { canvas.toBlob(resolve, 'image/jpeg', QUALITY); });
    }).then(function (blob) {
      if (!blob || blob.size >= file.size) return null;
      return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg', lastModified: Date.now() });
    }).catch(function () { return null; });
  }
  document.addEventListener('change', function (e) {
    var input = e.target;
    if (!input.matches || !input.matches('input[type=file]') || input.hasAttribute('data-no-shrink')) return;
    var files = Array.prototype.slice.call(input.files || []);
    if (!files.length) return;
    var job = Promise.all(files.map(shrink)).then(function (out) {
      if (!out.some(Boolean)) return;
      var box = new DataTransfer();
      out.forEach(function (file, i) { box.items.add(file || files[i]); });
      input.files = box.files;
    });
    pending.set(input, job);
    job.then(function () { if (pending.get(input) === job) pending.delete(input); });
  }, true);
  // ছোট করা শেষ হওয়ার আগে "সেভ" চাপলে একটু অপেক্ষা করে তারপর পাঠায়
  document.addEventListener('submit', function (e) {
    var form = e.target, jobs = [];
    Array.prototype.forEach.call(form.querySelectorAll('input[type=file]'), function (input) {
      if (pending.has(input)) jobs.push(pending.get(input));
    });
    if (!jobs.length) return;
    e.preventDefault();
    e.stopPropagation();
    var submitter = e.submitter && !e.submitter.disabled ? e.submitter : null;
    Promise.all(jobs).then(function () {
      if (form.requestSubmit) form.requestSubmit(submitter || undefined); else form.submit();
    });
  }, true);
})();
</script>
