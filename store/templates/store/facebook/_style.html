<style>
  /* Facebook অটোমেশন আর Messenger-এর কথোপকথন (store/facebook/*.html) — panel_styles.html-এর উপরে */
  .fb-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }

  .st-shortcut-lite:hover { background: rgba(255,255,255,.08); color: #fff; }
